<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Github</title>
    <link rel="stylesheet" href="main.css">
</head>
<body>
    <header>
        <div class="container">
            <img class="profile-avatar" src="https://via.placeholder.com/180x180" alt=".">
            <h1 class="profile-name">Seu nome</h1>
            <h2 class="profile-username">@nomeUsuario</h2>
            <ul class="numbers">
                <li class="numbers-item">
                    <h4>Repositórios</h4>
                    0
                </li>
                <li class="numbers-item">
                    <h4>Seguidores</h4>
                    0
                </li>
                <li class="numbers-item">
                    <h4>Seguindo</h4>
                    0
                </li>
            </ul>
            <a href="#" class="profile-link">Ver no Github</a>
            <div style="margin: 24px 0;">
                <input type="text" id="usuarioInput" placeholder="Digite o usuário do GitHub" style="padding:8px; width:200px;">
                <button id="buscarBtn" style="padding:8px 16px;">Buscar</button>
            </div>
        </div>
    </header>
    <script src="main.js"></script>
</body>
</html>
