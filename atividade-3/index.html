<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário de Depósito - Atividade 3</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; }
        form { max-width: 400px; margin: auto; }
        label { display: block; margin-top: 15px; }
        input { width: 100%; padding: 8px; margin-top: 5px; }
        .mensagem { margin-top: 20px; font-weight: bold; }
        #saida { margin-top: 20px; padding: 10px; border-radius: 5px; }
    </style>
</head>
<body>
    <h2>Depósito Bancário</h2>
    <form id="form-deposito">
        <label for="nome-beneficiario">Nome do Beneficiário</label>
        <input type="text" id="nome-beneficiario" required>

        <label for="numero-da-conta">Número da Conta</label>
        <input type="text" id="numero-da-conta" required>

        <label for="valor">Valor do Depósito</label>
        <input type="number" id="valor" required>

        <button type="submit">Depositar</button>
    </form>
    <p id="saida"></p>
    <div id="mensagem" class="mensagem"></div>
    <script src="./main.js"></script>
</body>
</html>
